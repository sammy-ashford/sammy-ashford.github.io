{{- /* ABOUTME: Static page template (About, etc.) — clean, spare, no dateline */ -}}
{{- /* ABOUTME: Used when front matter sets layout: "page" */ -}}
{{ define "main" }}
  <article class="page-content">
    <h1>{{ .Title }}</h1>
    {{ with .Params.image }}
      <figure class="page-portrait">
        <img src="{{ . | relURL }}" alt="{{ $.Params.image_alt | default $.Title }}">
      </figure>
    {{ end }}
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
